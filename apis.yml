name: Zinier
description: >-
  Zinier is a no-code field service management platform that helps enterprises
  schedule and manage their workforce, assets, and customers, powered by
  generative AI. Its office and field experiences pair ready-to-use productivity
  tools with a no-code Task Builder for building custom workflows, and an
  Integration Marketplace advertising 1,000+ out-of-the-box connections to ERP,
  CRM, and EAM systems such as SAP, Oracle, Microsoft, Salesforce, Zendesk,
  ServiceNow, IBM, and Infor. Zinier targets asset-intensive field-service
  operations, from scheduling and dispatch through mobile task execution and
  customer communication. The company was surfaced as a portfolio company of
  Accel and ICONIQ Capital. No public developer API, API reference, or OpenAPI
  surface is published today — integration is delivered through the marketplace
  and end-user product documentation.
